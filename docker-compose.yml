services:
  db:
    image: postgres:15
    container_name: sms_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"      # 5433 externally to avoid clash with old DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"          # 6380 externally to avoid clash with old Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Django / Daphne ASGI) ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: sms_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db                           # container service name
      DB_PORT: 5432                         # internal port (not the host-mapped one)
      REDIS_URL: redis://redis:6379/1
    volumes:
      - ./backend:/app                      # map host backend code to container
      - media_files:/app/media              # persist uploaded files
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Frontend (Next.js production) ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        INTERNAL_API_URL: http://backend:8000
    container_name: sms_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://backend:8000
      NODE_ENV: production
    depends_on:
      - backend

  # ─── Nginx (reverse proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sms_nginx
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - default
      - web
    extra_hosts:
      - "host.docker.internal:host-gateway"


  # ─── pgAdmin (optional, DB management UI) ────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: sms_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-8082}:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:

networks:
  web:
    external: true